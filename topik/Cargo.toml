[package]
name = "topik"
version = "0.1.0"
edition = "2024"
description = "Typed pub/sub topics for Rust"
license = "MIT"
repository = "https://github.com/railforge/topik"

[dependencies]
topik-core = { path = "../topik-core" }
topik-macros = { path = "../topik-macros" }
bytes = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }


[features]
default = []
mqtt = []
